name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate package
        run: npm run validate

      - name: Run CLI tests
        run: npm test

      - name: Test CLI help and package listing
        run: |
          node bin/verdicspec.mjs help
          node bin/verdicspec.mjs list

      - name: Check package contents
        run: npm pack --dry-run

