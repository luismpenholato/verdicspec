name: Release on main

on:
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'README.md'
      - '.cursor/**'
      - '.claude/**'
      - '.agents/**'
      - 'agents/**'
      - '.verdicspec/**'
      - 'bin/**'
      - 'commands/**'
      - 'docs/**'
      - 'skills/**'
      - 'technology-packs/**'
      - 'templates/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

concurrency:
  group: release-on-main
  cancel-in-progress: false

jobs:
  release:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip release]')
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Validate package
        run: npm run validate

      - name: Run tests
        run: npm test

      - name: Increment patch version
        id: version
        shell: bash
        run: |
          npm version patch --no-git-tag-version
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish

      - name: Create release commit and tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): v${VERSION}"
          git tag --annotate "v${VERSION}" --message "Release v${VERSION}"
          git push origin HEAD:main
          git push origin "v${VERSION}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v${VERSION}"
          for attempt in 1 2 3 4 5 6; do
            if gh api "repos/${GH_REPOSITORY}/git/ref/tags/${TAG}" > /dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "Tag ${TAG} was not visible through the GitHub API after pushing it."
              exit 1
            fi
            sleep 2
          done
          gh api --method POST "repos/${GH_REPOSITORY}/releases" \
            -f "tag_name=${TAG}" \
            -f "target_commitish=${GITHUB_SHA}" \
            -f "name=${TAG}" \
            -F generate_release_notes=true
